<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paddle 3D Environment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #stats {
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="ui">
            <div><strong>AI Paddle Simulation</strong></div>
            <div id="stats">
                <div>Ball Position: <span id="ballPos">0, 0, 0</span></div>
                <div>Ball Velocity: <span id="ballVel">0, 0, 0</span></div>
                <div>Paddle Position: <span id="paddlePos">0, 0</span></div>
                <div>AI Action: <span id="aiAction">none</span></div>
                <div>Predicted Intercept: <span id="intercept">0, 0</span></div>
                <div>Score: <span id="score">0</span></div>
            </div>
        </div>
        <div id="controls">
            <button id="startBtn">Start Simulation</button>
            <button id="resetBtn">Reset</button>
            <button id="pauseBtn" disabled>Pause</button>
        </div>
    </div>

    <script>
        // Load AI weights from your data
        const aiWeights = {
            "W_hidden_input": [[0.07571163054980735,-0.09879728658770932,-0.0025411196896264507,1.2834025446819128,-1.4762437387130491,-2.0096605239446923,-0.04497989174719303,0.14464276705798085,-0.14384152071922535,-2.6871606026881096,-0.037192423671404184,0.02891691912057464,-311.3089085534629,0.22422554934879174],[-0.055908044001824246,0.17897313214296667,0.019693933411955793,-0.5555207873771879,2.2761658471179262,0.4055828201728979,0.08063808511155879,-0.05247733265746928,0.18930662438179605,-1.3870115399946836,0.10819959396504145,-0.17703519849842672,0.21735121993685436,-189.5703621437401],[-0.11996995608546475,-0.16821818278725512,-0.026514615265630273,0.520352123122718,-1.3549415695435347,-2.9536055627943325,0.15578515626907521,-0.0031034380345209,-0.25930133582777615,-2.439842863941628,0.005400387386199475,0.13899807600698164,0.011086514603524996,-344.7379207044564],[0.7236220416763963,-0.7871593103401202,-0.24919496022967125,1.9015394668118888,-3.5155533070112055,2.6854562433555818,-0.6834962795564965,0.679048354753963,0.26495820359637,1.7243039339691388,0.27930093887360574,-0.5971802296707363,-2.471654659060362,-245.94307039350815],[-2.019671960006264,-0.4552554572845688,15.809793749060773,-4.979472406891216,-0.6555166883461876,-1.5327924331613594,2.062761900500206,-0.47765952031314085,0.6138937109126485,3.601799382496622,-0.1811326547677063,1.2113076421581033,-1.2295364922849528,2.3901557464885883],[0.25728658284217976,-0.022569852547878164,0.01915896336102582,2.292436855209007,-2.0371010602550226,1.8217104475416137,-0.138520495181266,0.030168343696500587,0.050822933268802196,1.9486108885543594,-0.17303163095891064,-0.0782311195475366,306.533478053833,0.6168269323406569],[-5.077476498576406,-3.783217007223332,0.508926921028604,8.177646077753312,-15.211351776485696,-0.876980750720473,4.252700487941269,1.266400102200764,-0.24846508983015184,-1.5981345783902479,0.6658633679768005,-4.4944315300882645,-6.0136894879371585,-2.8451471648701805],[0.2813295759387656,-0.23039634610601592,-0.20863415124998796,0.8625718396842388,-2.207002890024836,1.8799220975780464,-0.18053700863124647,0.13890810093255304,0.1770980915304153,-1.5416157760064633,0.1305220551356998,-0.1868867783268398,-0.05468156885394678,257.73787489774804],[-0.1291139150396751,-0.305971056100352,0.1848967650463433,-0.9415930364495617,1.880637367153625,-2.7239235222535947,0.03905840076017982,0.26416629828739535,-0.6437493151592494,-2.29718676163057,0.009946265957835017,0.0650425471060561,-0.5048016679176428,310.5769867828448],[3.0700962227538042,-2.240844280894971,9.652366144098082,-3.319920397073904,8.98419295367224,1.7142406779904562,-2.0252012396690495,-0.5955949335514298,-0.43274840924580144,-1.2694721763951071,-2.200798866694345,-0.32225619585529414,-5.573865701783698,7.5583317441730244],[0.11709059555324605,0.015467543734551415,-0.11442797399781522,-0.7890912398098265,1.3026122649321992,0.6166225733936866,0.03572383519838623,0.0935330428667419,0.6847475335566203,2.192350259882323,-0.12751882887273813,-0.000010840398174364866,-242.5461858393826,-0.03143053740709588],[0.08643936911585474,-0.003811546995645865,0.03134681026362951,-0.14102672668016178,0.7927377534217558,-2.8904705355734923,-0.013111737220672128,0.02185929231092091,-0.7864752325199064,-2.537558240318566,-0.010260937499850433,0.035806261857610475,379.0260097205163,-0.13087664108676106]],
            "W_hidden_output": [[8.441808794552111,-33.106030509716355,-21.910602347630284,-17.47655220581277,1.4383373729040745,-2.8756694985605007,0.7861629352794715,23.14513560564827,20.08447300246348,0.8163995900382018,-4.443163801062265,4.9535036976720885],[7.082982023238169,23.189538835820464,22.016210299696944,24.647903965171082,-0.24541110379151537,-4.406583997731274,-2.633629656321939,-18.02046733969284,-26.107482393495346,-1.106158706196698,-8.11906188272826,1.8450016051976486],[24.852681997262536,9.760592782394216,2.347784046223444,-5.8702280410649585,0.8337743742011335,-19.819306929545693,-1.5417711161069945,-7.825156505412876,6.641781982768545,-0.37197338899338256,26.797266816568367,-26.419180660802475],[-29.836484427635774,9.462268838534634,2.107105164835105,-6.188779657307045,0.14096064612022308,26.180098625362263,0.7662680640213225,-7.1348598246391886,5.391174754373744,-1.6207106304265115,-18.891850162791883,24.124549454167685],[-35.28632183498873,-31.401234866694974,-22.62465299366761,-16.811778271777314,-0.14685252083972575,26.855185215353004,1.7583029840702484,23.46334737709763,21.1435577907907,1.1009595997362445,-18.79395150038529,24.63242186481537],[26.66201645505108,-35.690215393483186,-27.17615090761119,-17.640152875296618,-0.3262412124472861,-19.121904398266935,4.102492019689961,23.02015025294894,21.13937590828712,2.5358596775531277,28.71857168225681,-29.564150785875114],[-35.04453266129624,23.961954593367143,21.10454353413732,25.289620498610486,-1.3518234286889679,16.021231751153415,-1.5313278501349157,-14.144306339588473,-24.05587728113364,-0.6310829424821627,-20.22730187547018,22.6324607707043],[24.556865334018443,23.0514711940765,22.058309194283158,21.440103110203395,-1.408387199977011,-20.521247522308997,-2.9593583991563635,-14.532611463855607,-28.77806755293771,1.1322881667264317,21.025270968815484,-26.99503588861358],[7.7584654253010665,10.239397925571097,1.6384520592465364,-6.570112313074126,1.927398846626422,-3.7269525704903,0.34870457317630604,-7.471710727791229,5.021996147038518,-1.952256870243599,-5.615222365595387,3.8942143597865715]],
            "bias_hidden_layer": [-7.866879993729436,-4.845273689686368,-9.18207843012388,6.332289200620433,12.338830862091719,8.196794697292912,-6.244055367663034,-5.859098776425264,-7.700134526860949,-3.781786181611518,6.022592376013554,-9.773657648453018],
            "bias_output_layer": [17.599080837989142,0.9628167161055764,10.51686608489197,10.389311767280544,-15.910724403132166,-17.537433628773385,-24.75087290582725,-26.055310566085875,44.352390533525025]
        };

        const actions = ['up', 'down', 'left', 'right', 'up-right', 'up-left', 'down-right', 'down-left', 'none'];

        // AI Neural Network Implementation
        class NeuralAI {
            constructor() {
                this.W_hidden_input = aiWeights.W_hidden_input;
                this.W_hidden_output = aiWeights.W_hidden_output;
                this.bias_hidden_layer = aiWeights.bias_hidden_layer;
                this.bias_output_layer = aiWeights.bias_output_layer;
                this.num_inputs = 14;
                this.num_hidden = 12;
                this.num_outputs = 9;
            }

            dotProduct(a, b) {
                let sum = 0;
                for (let i = 0; i < a.length; i++) {
                    sum += a[i] * b[i];
                }
                return sum;
            }

            sigmoid(x) {
                return 1 / (1 + Math.exp(-x));
            }

            softmax(logits) {
                const maxLogit = Math.max(...logits);
                const expScores = logits.map(v => Math.exp(v - maxLogit));
                const sumExp = expScores.reduce((a, b) => a + b, 0);
                return expScores.map(v => v / sumExp);
            }

            stateToVector(state) {
                return [
                    state.X_pos, state.Y_pos, state.Z_pos,
                    state.Vx, state.Vy, state.Vz,
                    state.X_paddle, state.Y_paddle,
                    state.paddle_speed, state.paddle_height,
                    state.time_to_wall_x, state.time_to_wall_y,
                    state.x_dist_to_paddle, state.y_dist_to_paddle
                ];
            }

            predict(state) {
                const input = this.stateToVector(state);
                
                // Hidden layer
                const hidden = [];
                for (let i = 0; i < this.num_hidden; i++) {
                    hidden[i] = this.sigmoid(this.dotProduct(input, this.W_hidden_input[i]) + this.bias_hidden_layer[i]);
                }
                
                // Output layer
                const logits = [];
                for (let i = 0; i < this.num_outputs; i++) {
                    logits[i] = this.dotProduct(hidden, this.W_hidden_output[i]) + this.bias_output_layer[i];
                }
                const outputs = this.softmax(logits);
                
                // Find best action
                let maxScore = -Infinity;
                let bestIndex = -1;
                for (let i = 0; i < outputs.length; i++) {
                    if (outputs[i] > maxScore) {
                        maxScore = outputs[i];
                        bestIndex = i;
                    }
                }
                
                return actions[bestIndex];
            }
        }

        // Game state and variables
        let scene, camera, renderer, gameArea, ball, paddle, interceptPoint;
        let ballState = {
            X_pos: 0, Y_pos: 0, Z_pos: 0.8,
            Vx: 0.02, Vy: 0.015, Vz: -0.03
        };
        let paddleState = {
            X_paddle: 0, Y_paddle: 0,
            paddle_speed: 0.009,
            paddle_width: 0.3,
            paddle_height: 0.3
        };

        const gameAreaSize = { width: 1.8, height: 1.8, depth: 1.8 };
        const paddleZ = -0.9;
        let isRunning = false;
        let score = 0;
        let ai = new NeuralAI();

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2, 2, 2);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Game area (wireframe box)
            const gameAreaGeometry = new THREE.BoxGeometry(gameAreaSize.width, gameAreaSize.height, gameAreaSize.depth);
            const gameAreaMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff00,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            gameArea = new THREE.Mesh(gameAreaGeometry, gameAreaMaterial);
            scene.add(gameArea);

            // Ball
            const ballGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const ballMaterial = new THREE.MeshLambertMaterial({ color: 0xff4444 });
            ball = new THREE.Mesh(ballGeometry, ballMaterial);
            ball.castShadow = true;
            scene.add(ball);

            // Paddle
            const paddleGeometry = new THREE.BoxGeometry(paddleState.paddle_width, paddleState.paddle_height, 0.02);
            const paddleMaterial = new THREE.MeshLambertMaterial({ color: 0x4444ff });
            paddle = new THREE.Mesh(paddleGeometry, paddleMaterial);
            paddle.position.z = paddleZ;
            paddle.castShadow = true;
            paddle.receiveShadow = true;
            scene.add(paddle);

            // Intercept point indicator
            const interceptGeometry = new THREE.SphereGeometry(0.03, 8, 8);
            const interceptMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.7 });
            interceptPoint = new THREE.Mesh(interceptGeometry, interceptMaterial);
            interceptPoint.position.z = paddleZ;
            scene.add(interceptPoint);

            // Add grid for reference
            const gridHelper = new THREE.GridHelper(2, 20, 0x444444, 0x222222);
            gridHelper.position.y = -gameAreaSize.height / 2;
            scene.add(gridHelper);
        }

        // Predict intercept point
        function predictIntercept(X_pos, Y_pos, Z_pos, Vx, Vy, Vz) {
            let x = X_pos, y = Y_pos, z = Z_pos;
            let vx = Vx, vy = Vy, vz = Vz;

            let iterations = 0;
            const maxIterations = 100;

            while (iterations < maxIterations) {
                if (vz >= 0 || z <= paddleZ) return { x, y };

                const t = (paddleZ - z) / vz;

                // Time to hit walls
                let tx = Infinity, ty = Infinity;
                if (vx > 0) tx = (gameAreaSize.width / 2 - x) / vx;
                else if (vx < 0) tx = (-gameAreaSize.width / 2 - x) / vx;
                if (vy > 0) ty = (gameAreaSize.height / 2 - y) / vy;
                else if (vy < 0) ty = (-gameAreaSize.height / 2 - y) / vy;

                const tWall = Math.min(tx, ty);

                if (t < tWall) {
                    return { x: x + vx * t, y: y + vy * t };
                } else {
                    if (tx < ty) {
                        x += vx * tx; y += vy * tx; z += vz * tx;
                        vx *= -1;
                    } else {
                        x += vx * ty; y += vy * ty; z += vz * ty;
                        vy *= -1;
                    }
                }
                iterations++;
            }

            return { x, y };
        }

        // Update simulation
        function updateSimulation() {
            if (!isRunning) return;

            // Calculate derived state for AI
            const maxTime = 50;
            
            let wall_x = ballState.Vx > 0 ? gameAreaSize.width / 2 : -gameAreaSize.width / 2;
            let wall_y = ballState.Vy > 0 ? gameAreaSize.height / 2 : -gameAreaSize.height / 2;
            
            let d_wall_x = wall_x - ballState.X_pos;
            let d_wall_y = wall_y - ballState.Y_pos;
            
            let time_to_wall_x = ballState.Vx !== 0 ? d_wall_x / ballState.Vx : Infinity;
            let time_to_wall_y = ballState.Vy !== 0 ? d_wall_y / ballState.Vy : Infinity;
            
            time_to_wall_x = Math.min(Math.max(time_to_wall_x / maxTime, 0), 1);
            time_to_wall_y = Math.min(Math.max(time_to_wall_y / maxTime, 0), 1);
            
            const intercept = predictIntercept(ballState.X_pos, ballState.Y_pos, ballState.Z_pos, 
                                            ballState.Vx, ballState.Vy, ballState.Vz);
            
            const dx = intercept.x - paddleState.X_paddle;
            const dy = intercept.y - paddleState.Y_paddle;
            
            const x_dist_to_paddle = dx / gameAreaSize.width;
            const y_dist_to_paddle = dy / gameAreaSize.height;

            // Create state for AI
            const aiState = {
                X_pos: ballState.X_pos,
                Y_pos: ballState.Y_pos,
                Z_pos: ballState.Z_pos,
                Vx: ballState.Vx,
                Vy: ballState.Vy,
                Vz: ballState.Vz,
                X_paddle: paddleState.X_paddle,
                Y_paddle: paddleState.Y_paddle,
                paddle_speed: paddleState.paddle_speed,
                paddle_height: paddleState.paddle_height,
                time_to_wall_x: time_to_wall_x,
                time_to_wall_y: time_to_wall_y,
                x_dist_to_paddle: x_dist_to_paddle,
                y_dist_to_paddle: y_dist_to_paddle
            };

            // Get AI action
            const action = ai.predict(aiState);

            // Move paddle based on AI action
            switch (action) {
                case 'up': paddleState.Y_paddle += paddleState.paddle_speed; break;
                case 'down': paddleState.Y_paddle -= paddleState.paddle_speed; break;
                case 'left': paddleState.X_paddle -= paddleState.paddle_speed; break;
                case 'right': paddleState.X_paddle += paddleState.paddle_speed; break;
                case 'up-right': 
                    paddleState.Y_paddle += paddleState.paddle_speed; 
                    paddleState.X_paddle += paddleState.paddle_speed; 
                    break;
                case 'up-left': 
                    paddleState.Y_paddle += paddleState.paddle_speed; 
                    paddleState.X_paddle -= paddleState.paddle_speed; 
                    break;
                case 'down-right': 
                    paddleState.Y_paddle -= paddleState.paddle_speed; 
                    paddleState.X_paddle += paddleState.paddle_speed; 
                    break;
                case 'down-left': 
                    paddleState.Y_paddle -= paddleState.paddle_speed; 
                    paddleState.X_paddle -= paddleState.paddle_speed; 
                    break;
            }

            // Constrain paddle to game area
            paddleState.X_paddle = Math.max(-gameAreaSize.width/2 + paddleState.paddle_width/2, 
                                          Math.min(gameAreaSize.width/2 - paddleState.paddle_width/2, paddleState.X_paddle));
            paddleState.Y_paddle = Math.max(-gameAreaSize.height/2 + paddleState.paddle_height/2, 
                                          Math.min(gameAreaSize.height/2 - paddleState.paddle_height/2, paddleState.Y_paddle));

            // Move ball
            ballState.X_pos += ballState.Vx;
            ballState.Y_pos += ballState.Vy;
            ballState.Z_pos += ballState.Vz;

            // Ball bouncing off walls (X and Y walls bounce, Z walls have different behavior)
            if (ballState.X_pos < -gameAreaSize.width / 2 || ballState.X_pos > gameAreaSize.width / 2) {
                ballState.Vx *= -1;
                ballState.X_pos = Math.max(Math.min(ballState.X_pos, gameAreaSize.width / 2), -gameAreaSize.width / 2);
            }
            if (ballState.Y_pos < -gameAreaSize.height / 2 || ballState.Y_pos > gameAreaSize.height / 2) {
                ballState.Vy *= -1;
                ballState.Y_pos = Math.max(Math.min(ballState.Y_pos, gameAreaSize.height / 2), -gameAreaSize.height / 2);
            }
            
            // Ball bouncing off front wall (opposite to AI paddle)
            if (ballState.Z_pos > gameAreaSize.depth / 2) {
                ballState.Vz *= -1;
                ballState.Z_pos = gameAreaSize.depth / 2;
            }

            // Check paddle collision
            if (ballState.Z_pos <= paddleZ + 0.05 && 
                Math.abs(ballState.X_pos - paddleState.X_paddle) < paddleState.paddle_width / 2 &&
                Math.abs(ballState.Y_pos - paddleState.Y_paddle) < paddleState.paddle_height / 2) {
                ballState.Vz *= -1;
                ballState.Z_pos = paddleZ + 0.05;
                score++;
            }

            // Reset if ball goes too far back
            if (ballState.Z_pos < -1.2) {
                resetBall();
            }

            // Update 3D objects
            ball.position.set(ballState.X_pos, ballState.Y_pos, ballState.Z_pos);
            paddle.position.set(paddleState.X_paddle, paddleState.Y_paddle, paddleZ);
            interceptPoint.position.set(intercept.x, intercept.y, paddleZ);

            // Update UI
            document.getElementById('ballPos').textContent = 
                `${ballState.X_pos.toFixed(2)}, ${ballState.Y_pos.toFixed(2)}, ${ballState.Z_pos.toFixed(2)}`;
            document.getElementById('ballVel').textContent = 
                `${ballState.Vx.toFixed(3)}, ${ballState.Vy.toFixed(3)}, ${ballState.Vz.toFixed(3)}`;
            document.getElementById('paddlePos').textContent = 
                `${paddleState.X_paddle.toFixed(2)}, ${paddleState.Y_paddle.toFixed(2)}`;
            document.getElementById('aiAction').textContent = action;
            document.getElementById('intercept').textContent = 
                `${intercept.x.toFixed(2)}, ${intercept.y.toFixed(2)}`;
            document.getElementById('score').textContent = score;
        }

        function resetBall() {
            ballState.X_pos = (Math.random() - 0.5) * gameAreaSize.width * 0.5;
            ballState.Y_pos = (Math.random() - 0.5) * gameAreaSize.height * 0.5;
            ballState.Z_pos = 0.8;
            ballState.Vx = (Math.random() - 0.5) * 0.04;
            ballState.Vy = (Math.random() - 0.5) * 0.04;
            ballState.Vz = -0.02 - Math.random() * 0.02;
        }

        function resetGame() {
            isRunning = false;
            score = 0;
            resetBall();
            paddleState.X_paddle = 0;
            paddleState.Y_paddle = 0;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            updateSimulation();
            renderer.render(scene, camera);
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', () => {
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        });

        document.getElementById('resetBtn').addEventListener('click', resetGame);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mouse controls for camera
        let mouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousedown', (event) => {
            mouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        document.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        document.addEventListener('mousemove', (event) => {
            if (!mouseDown) return;
            
            const deltaX = event.clientX - mouseX;
            const deltaY = event.clientY - mouseY;
            
            const spherical = new THREE.Spherical();
            spherical.setFromVector3(camera.position);
            spherical.theta -= deltaX * 0.01;
            spherical.phi += deltaY * 0.01;
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
            
            camera.position.setFromSpherical(spherical);
            camera.lookAt(0, 0, 0);
            
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        // Zoom with mouse wheel
        document.addEventListener('wheel', (event) => {
            const distance = camera.position.length();
            const newDistance = Math.max(1, Math.min(10, distance + event.deltaY * 0.01));
            camera.position.normalize().multiplyScalar(newDistance);
        });

        // Initialize and start
        initScene();
        animate();
        resetGame();
    </script>
</body>
</html>
