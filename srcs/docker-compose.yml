
services:
  sqlite:
    container_name: sqliteDB
    restart: always
    env_file: ../.env
    build:
      context: ./sqlite
      dockerfile: Dockerfile
    volumes:
      - sqlite-vol:/data
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /data/database.sqlite 'SELECT 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    container_name: backend
    restart: always
    env_file: ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - sqlite-vol:/data
    networks:
      - transcendence
    depends_on:
      redis:
        condition: service_started
      sqlite:
        condition: service_healthy
    ports:
      - "8080:8080"

  game_server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/game_server.js
    ports:
      - "8081:8081"
    volumes:
      - sqlite-vol:/data
    networks:
      - transcendence
    env_file: ./backend/.env

  frontend:
    container_name: frontend
    restart: always
    env_file: ../.env
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - transcendence
    depends_on:
      - backend

  redis:
    container_name: redis
    image: redis:6
    ports:
      - "6379:6379"
    networks:
      - transcendence

volumes:
  sqlite-vol:
    name: transcendence_sqlite_db
    driver_opts:
      type: none
      device: /home/capa/Documents/ft_transcendence/sqlite-data
      o: bind

networks:
  transcendence:
    name: transcendence
